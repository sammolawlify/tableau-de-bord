<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Priorités du jour</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<script src="app.js"></script>
<script src="data-actions.js"></script>
<script>
const DATA = window.DATA;
mount(`
<section class="card">
  <h2>Priorités du jour</h2>
  <ul>${DATA.priorites_du_jour.map(p =>
    `<li><span>${esc(p.label)}</span><span class="tag ${tagCls[p.level]}">${tagTxt[p.level]}</span></li>`).join("")}
  </ul>
  ${upd(DATA.updated)}
</section>`);
</script>
</body>
</html>
