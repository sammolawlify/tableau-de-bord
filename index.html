<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Actions, tâches, mails</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#1f2a33; --muted:#6b7680; --line:#e4e1d9;
    --accent:#2f6f5e; --accent-soft:#e3efeb;
    --urgent:#b4452f; --urgent-soft:#f6e4de;
    --warn:#a8741a; --warn-soft:#f6ecd5;
    --wait:#46688a; --wait-soft:#e2eaf2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161b1f; --card:#1f262c; --ink:#e8ebed; --muted:#98a3ab; --line:#2f383f;
      --accent:#6cc2a8; --accent-soft:#1f3a33;
      --urgent:#ef9a86; --urgent-soft:#3a2420;
      --warn:#e5b95c; --warn-soft:#3a3016;
      --wait:#8db3da; --wait-soft:#1f3042;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
  main{max-width:520px;margin:0 auto;display:grid;gap:10px}
  header h1{font-size:17px;margin:0 0 2px;font-weight:650}
  header p{margin:0;color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
  .counters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .counter{border-radius:10px;padding:10px 12px}
  .counter b{display:block;font-size:26px;line-height:1.1}
  .counter span{font-size:12px}
  .c-urgent{background:var(--urgent-soft);color:var(--urgent)}
  .c-todo{background:var(--warn-soft);color:var(--warn)}
  .c-wait{background:var(--wait-soft);color:var(--wait)}
  .c-chase{background:var(--accent-soft);color:var(--accent)}
  ul{list-style:none;margin:0;padding:0}
  li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  li:first-child{border-top:0}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap;align-self:center}
  .t-urgent{background:var(--urgent-soft);color:var(--urgent)}
  .t-high{background:var(--warn-soft);color:var(--warn)}
  .t-norm{background:var(--wait-soft);color:var(--wait)}
  .bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:6px 0 8px}
  .bar i{display:block;height:100%}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
  .legend em{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .na{color:var(--muted);font-style:italic}
  .big{font-size:22px;font-weight:650}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:2px 0 8px}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ==== DONNÉES (seule partie à mettre à jour chaque jour) ====
   Chiffres agrégés uniquement. Aucun nom, établissement, montant ni lien.
   null = donnée non disponible. */
const DATA = {
  updated: "16/11/2026 à 08:20",
  status: { a_traiter: 9, en_attente: 7, information: 5, termine: 3, sans_action: 1 },
  priority: { urgente: 1, elevee: 10, normale: 14 },
  relances_a_prevoir: 3,               // paiements échus à revoir
  priorites_du_jour: [
    { label: "1 contrat à envoyer avec ses pièces", level: "urgent" },
    { label: "4 fiches d'oral à relire et commenter", level: "high" },
    { label: "2 retours promis à des étudiants", level: "high" },
    { label: "1 planning d'oral à vérifier avant demain", level: "high" },
    { label: "1 réponse à une demande de copies", level: "norm" }
  ]
};
/* ==== FIN DES DONNÉES ==== */

const S = DATA.status;
const total = Object.values(S).reduce((a,b)=>a+b,0);
const tagCls = {urgent:"t-urgent",high:"t-high",norm:"t-norm"};
const tagTxt = {urgent:"Urgent",high:"Élevé",norm:"Normal"};
const seg = (n,c) => `<i style="width:${100*n/total}%;background:${c}"></i>`;

document.getElementById("app").innerHTML = `
<header>
  <h1>Actions, tâches, mails</h1>
  <p>Données au ${DATA.updated}</p>
</header>

<section class="card">
  <h2>Situation (${total} échanges suivis)</h2>
  <div class="counters">
    <div class="counter c-urgent"><b>${DATA.priority.urgente}</b><span>Urgent</span></div>
    <div class="counter c-todo"><b>${S.a_traiter}</b><span>À traiter</span></div>
    <div class="counter c-wait"><b>${S.en_attente}</b><span>En attente</span></div>
    <div class="counter c-chase"><b>${DATA.relances_a_prevoir}</b><span>Relances à prévoir</span></div>
  </div>
  <div class="bar">
    ${seg(S.a_traiter,"var(--warn)")}${seg(S.en_attente,"var(--wait)")}${seg(S.information,"var(--muted)")}${seg(S.termine,"var(--accent)")}${seg(S.sans_action,"var(--line)")}
  </div>
  <div class="legend">
    <span><em style="background:var(--muted)"></em>Information ${S.information}</span>
    <span><em style="background:var(--accent)"></em>Terminé ${S.termine}</span>
    <span><em style="background:var(--line)"></em>Sans action ${S.sans_action}</span>
  </div>
</section>

<section class="card">
  <h2>Priorités du jour</h2>
  <ul>${DATA.priorites_du_jour.map(p =>
    `<li><span>${p.label}</span><span class="tag ${tagCls[p.level]}">${tagTxt[p.level]}</span></li>`).join("")}
  </ul>
</section>

`;
</script>
</body>
</html>
