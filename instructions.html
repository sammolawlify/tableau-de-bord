<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Instructions pour Claude</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section class="card">
  <h2>Instruction pour Claude</h2>
  <textarea id="t" class="consigne" placeholder="Ex. : ne plus signaler tel e-mail…"></textarea>
  <a id="b" class="envoi off" href="#" target="_blank" rel="noopener">Préparer l'e-mail</a>
  <a id="m" class="alt off" href="#">Ou avec l'application de messagerie</a>
  <p class="upd">Gmail s'ouvre pré-rempli. Il reste à cliquer sur Envoyer. Le texte reste ici jusqu'à l'envoi.</p>
</section>
</main>
<script>
const TO = ["said.basaid.pro", "gmail.com"].join("@");   // adresse assemblée ici pour ne pas figurer en clair dans le code
const t = document.getElementById("t"), b = document.getElementById("b"), m = document.getElementById("m");
function maj(){
  const txt = t.value.trim();
  const d = new Date().toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit"});
  const su = encodeURIComponent("[CLAUDE] consigne du " + d), body = encodeURIComponent(txt);
  b.href = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(TO) + "&su=" + su + "&body=" + body;
  m.href = "mailto:" + TO + "?subject=" + su + "&body=" + body;
  b.classList.toggle("off", !txt); m.classList.toggle("off", !txt);
}
t.addEventListener("input", maj);
[b, m].forEach(x => x.addEventListener("click", e => { if (!t.value.trim()) e.preventDefault(); }));
maj();
</script>
</body>
</html>
