<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Instructions pour Claude</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section class="card">
  <h2>Instruction pour Claude</h2>
  <textarea id="t" class="consigne" placeholder="Ex. : ne plus signaler tel e-mail…"></textarea>
  <button id="b" class="envoi" disabled>Préparer l'e-mail</button>
  <p class="upd">Gmail s'ouvre pré-rempli. Il reste à cliquer sur Envoyer.</p>
</section>
</main>
<script>
const TO = "said.basaid.pro@gmail.com";
const t = document.getElementById("t"), b = document.getElementById("b");
t.addEventListener("input", () => b.disabled = !t.value.trim());
b.addEventListener("click", () => {
  const d = new Date().toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit"});
  const url = "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(TO) +
    "&su=" + encodeURIComponent("[CLAUDE] consigne du " + d) +
    "&body=" + encodeURIComponent(t.value.trim());
  window.open(url, "_blank", "noopener");
  t.value = ""; b.disabled = true;
});
</script>
</body>
</html>
