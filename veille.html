<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Veille métier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<script src="app.js"></script>
<script src="data-veille.js"></script>
<script>
const D = window.DATA_VEILLE;
mount(`
<section class="card">
  <h2>Veille métier (${Math.min(D.items.length,5)})</h2>
  <ul class="veille">${D.items.slice(0,5).map(i => `
    <li>
      <a href="${esc(i.url)}" target="_blank" rel="noopener">${i.important ? '<span class="dot"></span>' : ''}${esc(i.titre)}</a>
      <small>${esc(i.theme)} · ${esc(i.date)}${i.note ? " · " + esc(i.note) : ""}</small>
    </li>`).join("")}
  </ul>
  ${upd(D.updated, 130)}
</section>`);
</script>
</body>
</html>
